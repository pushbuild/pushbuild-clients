[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pushbuild"
version = "0.1.0"
description = "Client for the Pushbuild data APIs: 350+ official and public data sources (SEC, Fed, BLS, BEA, USDA, NOAA, central banks, crypto exchanges) behind one key"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Pushbuild LLC", email = "admin@pushbuild.com"}]
keywords = ["api", "open data", "economic data", "sec edgar", "financial data", "government data"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://pushbuild.com/apis"
Documentation = "https://api.pushbuild.com"
